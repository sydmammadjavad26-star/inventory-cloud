name: Build Anbaryar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create project files
        shell: bash
        run: |
          mkdir -p src/assets
          echo '' | base64 -d > pyproject.toml
          echo 'IyDYp9mG2KjYp9ix24zYp9ixCg==' | base64 -d > README.md
          echo '' | base64 -d > src/main.py
          echo '' | base64 -d > src/assets/icon.png

      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-version: "1.0.0"
          build-number: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Anbaryar-APK
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
